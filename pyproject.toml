[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillchain"
version = "0.1.0"
description = "SkillChain: modular agent-skill framework (skills, routers, agent runtime, workflows)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SkillChain Contributors" }]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.26.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
